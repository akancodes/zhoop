name: TestFlight status

# Reads what App Store Connect has for this app (dev.akan.zhoop.noop): the newest builds and their TestFlight state, the app's groups, the
# builds each group holds and its testers. With "invite" ticked it first sends the TestFlight invitation email
# again to the testers named below; with "reinvite" it takes them off this app (only), puts them back in the group
# and invites them afresh. It changes nothing else.

on:
  workflow_dispatch:
    inputs:
      invite:
        description: Send the TestFlight invitation email again
        type: boolean
        default: false
      reinvite:
        description: Take the testers off this app, put them back in the group and invite them afresh
        type: boolean
        default: false
      add:
        description: Add the testers to the internal group (made if missing) and invite them
        type: boolean
        default: false
      testers:
        description: First names of App Store Connect users, comma-separated
        default: Bayram
      bundles:
        description: Also print the status of these apps (bundle ids, space-separated), read only
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID_PREFIX: dev.akan.zhoop
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TESTERS: ${{ inputs.testers }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Invite again
        if: inputs.invite
        run: node .github/scripts/asc.mjs invite "$RUNNER_TEMP/AuthKey.p8"

      - name: Take off and invite afresh
        if: inputs.reinvite
        run: node .github/scripts/asc.mjs reinvite "$RUNNER_TEMP/AuthKey.p8"

      - name: Add to the group
        if: inputs.add
        run: node .github/scripts/asc.mjs testers "$RUNNER_TEMP/AuthKey.p8"

      - name: Status
        env:
          BUNDLES: ${{ inputs.bundles }}
        run: |
          node .github/scripts/asc.mjs status "$RUNNER_TEMP/AuthKey.p8"
          for b in $BUNDLES; do APP_BUNDLE_ID="$b" node .github/scripts/asc.mjs status "$RUNNER_TEMP/AuthKey.p8"; done

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
